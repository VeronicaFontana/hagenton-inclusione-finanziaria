<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capire il Mutuo</title>
<script>
  (function() {
    try {
      const salvato = localStorage.getItem('tema');
      const scuro = salvato ? salvato === 'scuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (scuro) document.documentElement.setAttribute('data-theme', 'dark');
    } catch (e) {}
  })();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blu: #1a2744;
    --blu-testo: #1a2744;
    --blu-mid: #243356;
    --verde: #4a9b7f;
    --verde-light: #e8f5f0;
    --verde-label: #357057;
    --verde-btn: #357057;
    --arancio: #e8834a;
    --arancio-light: #fdf2ea;
    --arancio-label: #a55725;
    --blu-verdict: #2f5f8f;
    --blu-accento: #4a80c4;
    --rosso: #c0392b;
    --rosso-light: #fdecea;
    --grigio: #f5f6f8;
    --grigio-mid: #e2e5ea;
    --testo: #1a2744;
    --testo-soft: #5a6478;
    --bianco: #ffffff;
  }

  html[data-theme="dark"] {
    --blu-testo: #a9c2f0;
    --grigio: #10162a;
    --grigio-mid: #2c3557;
    --testo: #e7eaf3;
    --testo-soft: #9aa3bd;
    --bianco: #1a2140;

    --verde-light: #16332a;
    --arancio-light: #3a2415;
    --verde-label: #8fd9b8;
    --arancio-label: #f0bb8c;
    --blu-verdict: #8fb6ea;
    --rosso: #ff8a75;
    --rosso-light: #3a1512;
  }
  html[data-theme="dark"] .story-scene {
    background: linear-gradient(180deg, #1c2c42 0%, #17202f 65%, var(--grigio) 100%);
  }
  html[data-theme="dark"] .concept-text,
  html[data-theme="dark"] [style*="color:#2d5a47"],
  html[data-theme="dark"] [style*="color: #2d5a47"] { color: #8fd9b8 !important; }
  html[data-theme="dark"] .concept-text strong,
  html[data-theme="dark"] [style*="color:#1a3d2e"],
  html[data-theme="dark"] [style*="color: #1a3d2e"] { color: #bdf3da !important; }
  html[data-theme="dark"] .warning-text,
  html[data-theme="dark"] [style*="color:#7a4020"],
  html[data-theme="dark"] [style*="color: #7a4020"] { color: #f0bb8c !important; }
  html[data-theme="dark"] [style*="color:#7a1010"],
  html[data-theme="dark"] [style*="color: #7a1010"] { color: #ff9d8c !important; }
  html[data-theme="dark"] .input-error,
  html[data-theme="dark"] [style*="color:#c0392b"],
  html[data-theme="dark"] [style*="color: #c0392b"] { color: #ff8a75 !important; }
  html[data-theme="dark"] [style*="color:#4a80c4"],
  html[data-theme="dark"] [style*="color: #4a80c4"] { color: #8fb6ea !important; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--grigio);
    color: var(--testo);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: background 0.2s, color 0.2s;
  }

  .header {
    width: 100%;
    background: var(--blu);
    padding: 20px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-icon {
    width: 36px; height: 36px;
    background: var(--verde);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header-title {
    color: #ffffff;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.3px;
  }
  .header-sub {
    color: rgba(255,255,255,0.55);
    font-size: 12px;
    font-weight: 400;
    margin-top: 1px;
  }

  .access-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 7px 12px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: 'Inter', sans-serif;
    transition: background 0.2s, border-color 0.2s;
  }
  .access-toggle:hover { background: rgba(255,255,255,0.18); }
  .access-toggle[aria-pressed="true"] {
    background: var(--verde-btn);
    border-color: var(--verde-btn);
  }
  .access-icon {
    font-size: 13px;
    font-weight: 800;
    color: white;
    line-height: 1;
  }
  .access-label {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.85);
  }
  .access-toggle[aria-pressed="true"] .access-label,
  .access-toggle[aria-pressed="true"] .access-icon {
    color: white;
  }

  .theme-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: background 0.2s, border-color 0.2s;
  }
  .theme-toggle:hover { background: rgba(255,255,255,0.18); }
  .theme-toggle[aria-pressed="true"] {
    background: var(--verde);
    border-color: var(--verde);
  }
  .theme-icon { font-size: 14px; line-height: 1; }

  .lang-switch {
    display: flex;
    align-items: center;
    gap: 2px;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 3px;
    flex-shrink: 0;
  }
  .lang-btn {
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.7);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    padding: 5px 9px;
    border-radius: 16px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .lang-btn:hover { color: white; }
  .lang-btn.active { background: var(--verde-btn); color: white; }

  #google_translate_element,
  .goog-te-banner-frame,
  .goog-te-gadget-icon,
  .goog-te-menu-frame,
  iframe.skiptranslate,
  #goog-gt-tt,
  .goog-te-balloon-frame { display: none !important; visibility: hidden !important; height: 0 !important; }
  html, html body { top: 0 !important; position: static !important; margin-top: 0 !important; }
  .goog-te-gadget { font-size: 0 !important; }
  .goog-text-highlight { background: none !important; box-shadow: none !important; }
  .goog-tooltip, .goog-tooltip:hover { display: none !important; visibility: hidden !important; }
  .goog-tooltip:hover { display: none !important; }

  body.modo-semplice { font-size: 106%; }
  body.modo-semplice { --testo-soft: #38414f; }
  html[data-theme="dark"] body.modo-semplice { --testo-soft: #c3cadb; }
  body.modo-semplice .card-question { font-size: 22px; line-height: 1.35; }
  body.modo-semplice .card-hint { font-size: 16px; line-height: 1.65; }
  body.modo-semplice .concept-text,
  body.modo-semplice .warning-text { font-size: 16px; line-height: 1.7; }
  body.modo-semplice .concept-label,
  body.modo-semplice .warning-label { font-size: 12px; letter-spacing: 0.6px; }
  body.modo-semplice .card { border-width: 2px; }
  body.modo-semplice .btn-next {
    font-size: 17px;
    padding: 17px;
  }
  body.modo-semplice .input-field {
    font-size: 18px;
    padding: 15px 16px;
  }
  body.modo-semplice .option-btn { padding: 16px 18px; }
  body.modo-semplice .option-title { font-size: 16px; }
  body.modo-semplice .option-desc { font-size: 13.5px; line-height: 1.5; }
  body.modo-semplice .step-label { font-size: 12px; }

  .truncabile {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .truncabile.espanso {
    display: block;
    -webkit-line-clamp: unset;
    overflow: visible;
  }
  .btn-leggi-tutto {
    display: inline-block;
    margin: 2px 0 10px;
    background: none;
    border: none;
    color: var(--verde-label);
    font-weight: 700;
    font-size: 12.5px;
    cursor: pointer;
    padding: 4px 0;
    font-family: 'Inter', sans-serif;
  }
  .btn-leggi-tutto:hover { text-decoration: underline; }

  .story-scene {
    width: 100%;
    background: linear-gradient(180deg, #dceaf5 0%, #eef4f8 65%, var(--grigio) 100%);
    overflow: hidden;
    position: relative;
  }
  .story-scene-inner {
    max-width: 640px;
    margin: 0 auto;
    padding: 14px 20px 0;
  }
  .story-caption {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding-bottom: 6px;
  }
  .story-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--blu-testo);
  }
  .story-phase {
    font-size: 11px;
    font-weight: 600;
    color: var(--testo-soft);
    background: rgba(255,255,255,0.7);
    padding: 3px 10px;
    border-radius: 20px;
  }
  #houseSceneSvg {
    display: block;
    width: 100%;
    height: 108px;
  }

  .progress-bar-wrap {
    width: 100%;
    background: var(--blu-mid);
    height: 3px;
  }
  .progress-bar-fill {
    height: 3px;
    background: var(--verde);
    transition: width 0.5s ease;
  }

  .main {
    width: 100%;
    max-width: 640px;
    padding: 32px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .step-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--testo-soft);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 12px;
  }

  .card {
    background: var(--bianco);
    border-radius: 16px;
    padding: 24px;
    border: 1.5px solid var(--grigio-mid);
  }
  .card-question {
    font-size: 20px;
    font-weight: 700;
    color: var(--blu-testo);
    line-height: 1.3;
    margin-bottom: 14px;
  }
  .card-hint {
    font-size: 14px;
    color: var(--testo-soft);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .concept {
    background: var(--verde-light);
    border-left: 3px solid var(--verde);
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-bottom: 20px;
  }
  .concept-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--verde-label);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .concept-text {
    font-size: 13px;
    color: #2d5a47;
    line-height: 1.6;
  }
  .concept-text strong { color: #1a3d2e; }

  .warning {
    background: var(--arancio-light);
    border-left: 3px solid var(--arancio);
    border-radius: 0 10px 10px 0;
    padding: 14px 16px;
    margin-top: 12px;
  }
  .warning-label {
    font-size: 10px;
    font-weight: 700;
    color: var(--arancio-label);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .warning-text {
    font-size: 13px;
    color: #7a4020;
    line-height: 1.6;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }
  .input-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--testo);
  }
  .input-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .input-field {
    flex: 1;
    padding: 12px 14px;
    border: 1.5px solid var(--grigio-mid);
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--blu-testo);
    outline: none;
    transition: border-color 0.2s;
    -moz-appearance: textfield;
  }
  .input-field::-webkit-outer-spin-button,
  .input-field::-webkit-inner-spin-button { -webkit-appearance: none; }
  .input-field:focus { border-color: var(--verde); }
  .input-unit {
    font-size: 14px;
    font-weight: 600;
    color: var(--testo-soft);
    white-space: nowrap;
  }
  .input-error {
    font-size: 12px;
    color: #c0392b;
    display: none;
  }
  .input-error.visible { display: block; }

  .slider-wrap { margin-bottom: 4px; }
  .slider {
    width: 100%;
    -webkit-appearance: none;
    height: 6px;
    border-radius: 3px;
    background: var(--grigio-mid);
    outline: none;
    cursor: pointer;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--verde);
    border: 3px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    cursor: pointer;
  }
  .slider-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--testo-soft);
    margin-top: 6px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 16px;
  }
  .option-btn {
    padding: 14px 16px;
    border: 1.5px solid var(--grigio-mid);
    border-radius: 12px;
    background: var(--bianco);
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
  }
  .option-btn:hover { border-color: var(--verde); background: var(--verde-light); }
  .option-btn.selected { border-color: var(--verde); background: var(--verde-light); }
  .option-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--blu-testo);
    margin-bottom: 6px;
  }
  .option-desc {
    font-size: 12px;
    color: var(--testo-soft);
    line-height: 1.4;
  }

  .btn-next {
    width: 100%;
    padding: 15px;
    background: var(--blu);
    color: white;
    border: none;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 4px;
  }
  .btn-next:hover { background: var(--blu-mid); }
  .btn-next:disabled { background: var(--grigio-mid); color: var(--testo-soft); cursor: not-allowed; }

  .result-card {
    background: var(--blu);
    border-radius: 16px;
    padding: 28px 24px;
    color: white;
  }
  .result-title {
    font-size: 14px;
    color: rgba(255,255,255,0.6);
    font-weight: 500;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .result-big {
    font-size: 42px;
    font-weight: 800;
    color: white;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .result-sub {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 28px;
  }
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 20px;
  }
  .result-item {
    background: rgba(255,255,255,0.07);
    border-radius: 12px;
    padding: 14px;
  }
  .result-item-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    font-weight: 500;
  }
  .result-item-value {
    font-size: 20px;
    font-weight: 700;
    color: white;
  }
  .result-item-value.green { color: #7de8c0; }
  .result-item-value.orange { color: #f5a872; }

  .comparison {
    background: var(--bianco);
    border-radius: 16px;
    border: 1.5px solid var(--grigio-mid);
    overflow: hidden;
  }
  .comparison-header {
    padding: 16px 20px;
    font-size: 13px;
    font-weight: 700;
    color: var(--testo-soft);
    background: var(--grigio);
    border-bottom: 1px solid var(--grigio-mid);
  }
  /* Grid (non flex) per garantire che i valori delle due colonne restino
     allineati riga per riga: con flex, le righe che avevano anche un badge
     .comp-tag (4° elemento) si comprimevano in modo diverso dalle righe senza
     badge, sfasando le colonne "Fisso"/"Variabile" tra una riga e l'altra. */
  .comparison-row {
    display: grid;
    grid-template-columns: 1fr 90px 90px minmax(64px, auto);
    align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--grigio-mid);
    gap: 12px;
  }
  .comparison-row:last-child { border-bottom: none; }
  .comp-label { font-size: 14px; font-weight: 500; color: var(--testo); }
  .comp-a { text-align: right; font-size: 14px; font-weight: 700; color: var(--blu-testo); }
  .comp-b { text-align: right; font-size: 14px; font-weight: 700; color: var(--verde-label); }
  .comp-tag {
    font-size: 10px;
    font-weight: 700;
    padding: 3px 7px;
    border-radius: 20px;
    white-space: nowrap;
    justify-self: end;
  }
  .tag-better { background: var(--verde-light); color: var(--verde-label); }
  .tag-worse { background: var(--arancio-light); color: var(--arancio-label); }
  .tag-neutral { background: var(--grigio); color: var(--testo-soft); }
  .comp-col-header {
    display: grid;
    grid-template-columns: 1fr 90px 90px minmax(64px, auto);
    padding: 10px 20px;
    gap: 12px;
    background: var(--grigio);
    border-bottom: 1px solid var(--grigio-mid);
  }
  .col-h { font-size: 11px; font-weight: 700; }
  .col-h.a { text-align: right; color: var(--blu-testo); }
  .col-h.b { text-align: right; color: var(--verde-label); }

  .timeline {
    display: flex;
    flex-direction: column;
    gap: 0;
    margin: 16px 0;
  }
  .tl-item {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    padding-bottom: 20px;
    position: relative;
  }
  .tl-item::before {
    content: '';
    position: absolute;
    left: 15px;
    top: 32px;
    bottom: 0;
    width: 2px;
    background: var(--grigio-mid);
  }
  .tl-item:last-child::before { display: none; }
  .tl-dot {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--verde-light);
    border: 2px solid var(--verde);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }
  .tl-content { flex: 1; padding-top: 4px; }
  .tl-title { font-size: 14px; font-weight: 700; color: var(--blu-testo); margin-bottom: 8px; }
  .tl-text { font-size: 13px; color: var(--testo-soft); line-height: 1.5; }

  .btn-back {
    background: none;
    border: none;
    color: var(--testo-soft);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 0;
  }
  .btn-back:hover { color: var(--testo); }

  .btn-restart {
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--blu-testo);
    border: 1.5px solid var(--grigio-mid);
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-restart:hover { background: var(--grigio); }

  .chart-container {
    position: relative;
    height: 240px;
    width: 100%;
    margin: 16px 0 4px;
  }
  .chart-axis-hint {
    font-size: 11.5px;
    color: var(--testo-soft);
    line-height: 1.5;
    margin-bottom: 18px;
  }
  .chart-axis-hint strong { color: var(--testo); }

  .tabella-wrap {
    overflow-x: auto;
    margin: 4px 0 18px;
    border: 1.5px solid var(--grigio-mid);
    border-radius: 12px;
  }
  .tabella-rate {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
    min-width: 460px;
  }
  .tabella-rate th, .tabella-rate td {
    padding: 10px 12px;
    text-align: right;
    white-space: nowrap;
  }
  .tabella-rate th:first-child, .tabella-rate td:first-child { text-align: left; }
  .tabella-rate thead th {
    background: var(--grigio);
    color: var(--testo-soft);
    font-weight: 700;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 1px solid var(--grigio-mid);
  }
  .tabella-rate tbody tr:not(:last-child) td { border-bottom: 1px solid var(--grigio-mid); }
  .tabella-rate tbody td { color: var(--testo); }
  .tabella-rate td.col-interessi { color: var(--arancio-label); font-weight: 600; }

<body>

<div class="header">
  <div class="header-icon">🏠</div>

    <div class="header-title">Capire il Mutuo</div>

</div>

</div>
<div class="story-scene">
  <div class="story-scene-inner">
    <div class="story-caption">
      <div class="story-name" id="storyName">La tua storia</div>
      <div class="story-phase" id="storyPhase">Si comincia</div>
    </div>
    <svg id="houseSceneSvg" viewBox="0 0 400 108" preserveAspectRatio="xMidYMax meet"></svg>
  </div>
</div>

<div class="main" id="mainContent"></div>

<script>
const state = {
  step: 0,
  nome: '',
  valore_immobile: null,
  acconto: null,
  garanzia_consap: null,
  eta: null,
  durata: 20,
  tipo_tasso: null,
  tasso_fisso: 3.5,
  spread: 1.2,
  euribor: 3.8,
  reddito: null,
  spese_istruttoria: 1000,
  spese_perizia: 350,
  spese_notaio: 3500,
  cointestato: null,
  eta2: null,
  reddito2: null,
  modoSemplice: false,
};

const steps = [
  'benvenuto',
  'valore_immobile',
  'acconto',
  'ltv_spiegazione',
  'intestatari',
  'durata',
  'tipo_tasso',
  'tasso_dettaglio',
  'costi_iniziali',
  'riepilogo',
  'punteggio_salute',
  'confronto',
  'scenari_vita',
  'timeline_acquisto',
];

const TOTAL_STEPS = steps.length;

// Titoli brevi delle sezioni, usati nei pulsanti "Continua" per dire all'utente
// dove sta andando (non ripetono per forza il titolo pieno mostrato nella sezione
// stessa, che può contenere un sottotitolo troppo lungo per un pulsante).
const TITOLI_STEP = {
  valore_immobile: 'La casa',
  acconto: "L'acconto",
  ltv_spiegazione: 'LTV',
  intestatari: 'Chi richiede il mutuo',
  durata: 'Durata',
  tipo_tasso: 'Tipo di tasso',
  costi_iniziali: 'Costi iniziali',
  riepilogo: 'Il tuo riepilogo',
  punteggio_salute: 'Punteggio di salute',
  confronto: 'Fisso vs variabile',
  scenari_vita: 'Scenari di vita',
  timeline_acquisto: 'Il percorso completo',
};

// Titolo della sezione successiva a quella indicata, da mostrare nel pulsante
// "Continua". Gestisce a parte 'tasso_dettaglio', il cui titolo dipende dalla
// scelta fisso/variabile/misto fatta nello step precedente.
function titoloProssimaSezione(stepIdCorrente) {
  const idx = steps.indexOf(stepIdCorrente);
  const prossimo = steps[idx + 1];
  if (prossimo === 'tasso_dettaglio') {
    return state.tipo_tasso === 'variabile' ? 'Il tasso variabile' : 'Il tasso fisso';
  }
  return TITOLI_STEP[prossimo] || '';
}

function fmt(n, decimals=0) {
  return n.toLocaleString('it-IT', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function fmtEuro(n, decimals=0) {
  return '€ ' + fmt(n, decimals);
}

function dataOggiIT() {
  return new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
}

function campoNumericoValido(id) {
  const el = document.getElementById(id);
  if (!el || el.value === '') return false;
  const val = parseFloat(el.value);
  if (isNaN(val)) return false;
  const min = el.min !== '' ? parseFloat(el.min) : -Infinity;
  const max = el.max !== '' ? parseFloat(el.max) : Infinity;
  return val >= min && val <= max;
}

function calcRata(capitale, tasso_annuo, anni) {
  if (tasso_annuo === 0) return capitale / (anni * 12);
  const r = tasso_annuo / 100 / 12;
  const n = anni * 12;
  return capitale * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
}

function getLTV() {
  const mutuo = state.valore_immobile - state.acconto;
  return (mutuo / state.valore_immobile) * 100;
}

function getMutuo() {
  return state.valore_immobile - state.acconto;
}

function getTassoVariabile() {
  return state.euribor + state.spread;
}

function getEtaVincolante() {
  if (state.cointestato && state.eta2) {
    return Math.max(state.eta || 0, state.eta2);
  }
  return state.eta;
}

function getRedditoTotale() {
  const r1 = state.reddito || 0;
  const r2 = (state.cointestato && state.reddito2) ? state.reddito2 : 0;
  return r1 + r2;
}

function setProgress(current) {
  const pct = Math.round((current / (TOTAL_STEPS - 1)) * 100);
  document.getElementById('progressBar').style.width = pct + '%';
  renderStoryScene(pct);
}

const FASI = [
  { soglia: 0,   nome: 'Il terreno' },
  { soglia: 14,  nome: 'Le fondamenta' },
  { soglia: 28,  nome: 'I muri' },
  { soglia: 42,  nome: 'Il tetto' },
  { soglia: 56,  nome: 'Porta e finestre' },
  { soglia: 70,  nome: 'Il giardino' },
  { soglia: 84,  nome: 'Le luci accese' },
  { soglia: 96,  nome: 'Casa, dolce casa' },
];

function renderStoryScene(pct) {
  const nameEl = document.getElementById('storyName');
  const phaseEl = document.getElementById('storyPhase');
  const svg = document.getElementById('houseSceneSvg');
  if (!svg) return;

  const fase = [...FASI].reverse().find(f => pct >= f.soglia) || FASI[0];
  if (nameEl) nameEl.textContent = state.nome ? `La casa di ${state.nome}` : 'La tua storia';
  if (phaseEl) phaseEl.textContent = fase.nome;

  const show = (soglia) => pct >= soglia;
  const groundY = 92;

  let svgParts = [];

  const notte = document.documentElement.getAttribute('data-theme') === 'dark';
  if (notte) {
    svgParts.push(`<circle cx="358" cy="24" r="14" fill="#e9edf7"/>`);
    svgParts.push(`<circle cx="352" cy="19" r="12" fill="#1c2c42"/>`);
  } else {
    svgParts.push(`<circle cx="358" cy="24" r="14" fill="#ffd97a" opacity="0.9"/>`);
  }
  svgParts.push(`<ellipse cx="60" cy="26" rx="22" ry="8" fill="#ffffff" opacity="0.7"/>`);
  svgParts.push(`<ellipse cx="140" cy="18" rx="16" ry="6" fill="#ffffff" opacity="0.5"/>`);

  svgParts.push(`<rect x="0" y="${groundY}" width="400" height="16" fill="#c9dfc2"/>`);
  svgParts.push(`<rect x="0" y="${groundY+10}" width="400" height="6" fill="#b7d4ae"/>`);

  if (show(0)) {
    svgParts.push(`<line x1="60" y1="${groundY}" x2="60" y2="${groundY-6}" stroke="#9db894" stroke-width="2"/>`);
    svgParts.push(`<line x1="60" y1="${groundY-6}" x2="340" y2="${groundY-6}" stroke="#9db894" stroke-width="2" stroke-dasharray="4,4"/>`);
    svgParts.push(`<line x1="340" y1="${groundY}" x2="340" y2="${groundY-6}" stroke="#9db894" stroke-width="2"/>`);
  }

  if (show(14)) {
    svgParts.push(`<rect x="120" y="${groundY-4}" width="160" height="10" fill="#a8adb5" rx="1"/>`);
  }

  const wallTop = 46;
  if (show(28)) {
    const wallH = Math.min(groundY - wallTop, (groundY - wallTop) * Math.min(1, (pct-28)/10 + 0.4));
    svgParts.push(`<rect x="130" y="${groundY - wallH}" width="140" height="${wallH}" fill="#e3c9a3" />`);
    svgParts.push(`<rect x="130" y="${groundY - wallH}" width="140" height="${wallH}" fill="none" stroke="#c7a97a" stroke-width="1.5" />`);
  }

  if (show(42)) {
    svgParts.push(`<polygon points="120,${wallTop} 200,14 280,${wallTop}" fill="#c0533f"/>`);
    svgParts.push(`<polygon points="120,${wallTop} 200,14 280,${wallTop}" fill="none" stroke="#9c4230" stroke-width="1.5"/>`);
    svgParts.push(`<rect x="240" y="20" width="10" height="20" fill="#8b8b8b"/>`);
  }

  if (show(56)) {
    svgParts.push(`<rect x="188" y="66" width="24" height="26" rx="2" fill="#6b4226"/>`);
    svgParts.push(`<circle cx="206" cy="80" r="1.4" fill="#f0c419"/>`);
    svgParts.push(`<rect x="145" y="58" width="20" height="18" rx="2" fill="#bfe3f0" stroke="#8fa9b3" stroke-width="1.5"/>`);
    svgParts.push(`<rect x="235" y="58" width="20" height="18" rx="2" fill="#bfe3f0" stroke="#8fa9b3" stroke-width="1.5"/>`);
    svgParts.push(`<line x1="155" y1="58" x2="155" y2="76" stroke="#8fa9b3" stroke-width="1.2"/>`);
    svgParts.push(`<line x1="245" y1="58" x2="245" y2="76" stroke="#8fa9b3" stroke-width="1.2"/>`);
  }

  if (show(70)) {
    svgParts.push(`<rect x="200" y="88" width="8" height="4" fill="#d8c9a3"/>`);
    svgParts.push(`<circle cx="100" cy="82" r="9" fill="#5c9a5f"/>`);
    svgParts.push(`<rect x="98" y="88" width="4" height="6" fill="#7a5a3a"/>`);
    svgParts.push(`<circle cx="310" cy="84" r="7" fill="#5c9a5f"/>`);
    svgParts.push(`<rect x="308" y="90" width="3" height="4" fill="#7a5a3a"/>`);
  }

  if (show(84)) {
    svgParts.push(`<rect x="145" y="58" width="20" height="18" rx="2" fill="#ffe9a8"/>`);
    svgParts.push(`<rect x="235" y="58" width="20" height="18" rx="2" fill="#ffe9a8"/>`);
    svgParts.push(`<line x1="155" y1="58" x2="155" y2="76" stroke="#e8c877" stroke-width="1.2"/>`);
    svgParts.push(`<line x1="245" y1="58" x2="245" y2="76" stroke="#e8c877" stroke-width="1.2"/>`);
  }

  if (show(96)) {
    svgParts.push(`<text x="200" y="8" text-anchor="middle" font-size="14">💚</text>`);
    svgParts.push(`<rect x="118" y="86" width="6" height="8" fill="#8b8b8b"/>`);
  }

  svg.innerHTML = svgParts.join('');
}

function render() {
  const step = steps[state.step];
  setProgress(state.step);
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'animate-in';

  if (state.step > 0) {
    wrap.innerHTML += `<button class="btn-back" onclick="goBack()">← Torna indietro</button>`;
  }

  switch(step) {
    case 'benvenuto': renderBenvenuto(wrap); break;
    case 'valore_immobile': renderValoreImmobile(wrap); break;
    case 'acconto': renderAcconto(wrap); break;
    case 'ltv_spiegazione': renderLTV(wrap); break;
    case 'intestatari': renderIntestatari(wrap); break;
    case 'durata': renderDurata(wrap); break;
    case 'tipo_tasso': renderTipoTasso(wrap); break;
    case 'tasso_dettaglio': renderTassoDettaglio(wrap); break;
    case 'costi_iniziali': renderCostiIniziali(wrap); break;
    case 'riepilogo': renderRiepilogo(wrap); break;
    case 'punteggio_salute': renderPunteggioSalute(wrap); break;
    case 'confronto': renderConfronto(wrap); break;
    case 'scenari_vita': renderScenariVita(wrap); break;
    case 'timeline_acquisto': renderTimeline(wrap); break;
  }

  main.appendChild(wrap);
  window.scrollTo({ top: 0, behavior: 'smooth' });

  const currentStep = steps[state.step];

  if (currentStep === 'intestatari') {
    const inpEta = document.getElementById('inp_eta');
    if (inpEta) {
      inpEta.addEventListener('input', () => { updateEtaPreview(); sincronizzaBtnContinuaIntestatari(); });
      updateEtaPreview();
    }
    if (state.cointestato === true) {
      const btnCoppia = document.querySelectorAll('#options_cointestazione .option-btn')[1];
      if (btnCoppia) selectCointestazione(true, btnCoppia);
    } else if (state.cointestato === false) {
      const btnSolo = document.querySelectorAll('#options_cointestazione .option-btn')[0];
      if (btnSolo) selectCointestazione(false, btnSolo);
    }
    const inpRed = document.getElementById('inp_reddito');
    if (inpRed) {
      inpRed.addEventListener('input', () => { updateRedditoPreview(); sincronizzaBtnContinuaIntestatari(); });
      updateRedditoPreview();
    }
    sincronizzaBtnContinuaIntestatari();
  }
  if (currentStep === 'valore_immobile') {
    updatePreview();
    const inpValore = document.getElementById('inp_valore');
    if (inpValore) inpValore.addEventListener('keyup', e => {
      if (e.key === 'Enter') saveValoreImmobile();
    });
  }
  if (currentStep === 'acconto') {
    updateAccontoPreview();
  }
  if (currentStep === 'durata') {
    updateDurata(state.durata);
  }
  if (currentStep === 'tasso_dettaglio') {
    if (state.tipo_tasso === 'fisso' || state.tipo_tasso === 'misto') {
      updateTassoFissoPreview();
    } else {
      updateVariabilePreview();
    }
  }
  if (currentStep === 'costi_iniziali') {
    updateCostiPreview();
    ['inp_istruttoria','inp_perizia','inp_notaio'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('input', updateCostiPreview);
    });
  }
  if (currentStep === 'riepilogo') {
    const mutuo = getMutuo();
    const tasso = state.tipo_tasso === 'variabile' ? getTassoVariabile() : state.tasso_fisso;
    const datiPeriodi = calcolaDatiAmmortamentoPeriodi(mutuo, tasso, state.durata);
    disegnaGraficoRata(datiPeriodi);
  }
  applyModoSemplice();
}

function renderBenvenuto(wrap) {
  wrap.innerHTML += `
    <div class="step-label">Introduzione</div>
    <div class="card">
      <div class="card-question">Il mutuo spiegato in modo semplice</div>
      <div class="card-hint">
        Risponderai a poche domande sulla casa che vuoi acquistare.
        Ad ogni passo ti spieghiamo cosa significa ogni numero e ogni scelta,
        senza gergo tecnico.
      </div>
      <div class="concept">
        <div class="concept-label">💡 Cos'è un mutuo</div>
        <div class="concept-text">
          Un mutuo è un prestito a lungo termine che una banca ti dà per comprare casa.
          Tu restituisci i soldi mese per mese — ogni pagamento si chiama <strong>rata</strong> —
          per un periodo che può durare da 10 a 30 anni.
          In cambio, la banca ti chiede gli <strong>interessi</strong>: una percentuale aggiuntiva
          sul denaro che ti ha prestato.
        </div>
      </div>
      <div class="timeline">
        <div class="tl-item"><div class="tl-dot">1</div><div class="tl-content"><div class="tl-title">Valore della casa e acconto</div><div class="tl-text">Quanto costa la casa e quanto puoi versare subito di tasca tua.</div></div></div>
        <div class="tl-item"><div class="tl-dot">2</div><div class="tl-content"><div class="tl-title">Durata del mutuo</div><div class="tl-text">Per quanti anni vuoi restituire i soldi alla banca.</div></div></div>
        <div class="tl-item"><div class="tl-dot">3</div><div class="tl-content"><div class="tl-title">Tasso d'interesse</div><div class="tl-text">La percentuale che la banca ti chiede in più per prestarti i soldi.</div></div></div>
        <div class="tl-item"><div class="tl-dot">4</div><div class="tl-content"><div class="tl-title">Il tuo riepilogo</div><div class="tl-text">Rata mensile, costo totale e un confronto tra le opzioni.</div></div></div>

function saveNome() {
  const v = document.getElementById('inp_nome').value.trim();
  state.nome = v;
  nextStep();
}

function renderValoreImmobile(wrap) {
  wrap.innerHTML += `
    <div class="step-label">La casa</div>
    <div class="card">
      <div class="card-question">Quanto costa la casa che vuoi acquistare?</div>
      <div class="card-hint">Inserisci il prezzo di vendita concordato o indicativo.</div>
      <div class="concept">
        <div class="concept-label">💡 Valore dell'immobile</div>
        <div class="concept-text">
          È il prezzo totale della casa. Tieni presente che al prezzo di vendita
          si aggiungono altri costi: <strong>notaio</strong> (circa 2.000–5.000€),
          <strong>imposte</strong> (2% o 9% del valore catastale),
          <strong>agenzia immobiliare</strong> (circa 2–3% del prezzo).
          La banca di solito finanzia solo il prezzo della casa, non queste spese accessorie.
        </div>
      </div>
      <div class="input-group">
        <div class="input-label">Prezzo della casa</div>
        <div class="input-row">
          <input type="number" class="input-field" id="inp_valore"

            value="${state.valore_immobile || ''}"
            oninput="updatePreview()">
          <span class="input-unit">€</span>
        </div>
        <div class="input-error" id="err_valore">Inserisci un valore tra 50.000€ e 2.000.000€</div>
      </div>
      <div id="preview_valore" style="display:none" class="concept">
        <div class="concept-label">📊 Riepilogo rapido</div>
        <div class="concept-text" id="preview_valore_text"></div>
      </div>
      <button class="btn-next" id="btn_valore" onclick="saveValoreImmobile()" disabled>Continua: ${titoloProssimaSezione('valore_immobile')} →</button>
    </div>`;

}

function updatePreview() {
  const btn = document.getElementById('btn_valore');
  if (btn) btn.disabled = !campoNumericoValido('inp_valore');

  const v = parseFloat(document.getElementById('inp_valore')?.value);
  const preview = document.getElementById('preview_valore');
  if (!preview) return;
  if (v > 0) {
    preview.style.display = 'block';
    const spese = Math.round(v * 0.025) + 3000;
    document.getElementById('preview_valore_text').innerHTML =
      `Per una casa da <strong>${fmtEuro(v)}</strong>, considera circa <strong>${fmtEuro(spese)}</strong> di spese accessorie
      (notaio, imposte, agenzia). Il totale da avere disponibile è circa <strong>${fmtEuro(v + spese)}</strong>.`;
  } else {
    preview.style.display = 'none';
  }
}

function saveValoreImmobile() {
  const v = parseFloat(document.getElementById('inp_valore').value);
  if (!v || v < 50000 || v > 2000000) {
    document.getElementById('err_valore').classList.add('visible');
    return;
  }
  state.valore_immobile = v;
  nextStep();
}

function getMinAccontoPct() {
  return state.garanzia_consap ? 0 : 0.1;
}

function renderAcconto(wrap) {
  const minPct = getMinAccontoPct();
  const max_acconto = Math.round(state.valore_immobile * 0.8);
  const min_acc = Math.round(state.valore_immobile * minPct);
  const default_acc = state.acconto != null ? state.acconto : Math.round(state.valore_immobile * 0.2);

  wrap.innerHTML += `
    <div class="step-label">L'acconto</div>
    <div class="card">
      <div class="card-question">Rientri nella Garanzia Statale prima casa (Consap)?</div>
      <div class="card-hint">Se hai diritto a questa garanzia pubblica, puoi ottenere il mutuo anche senza anticipo.</div>
      <div class="concept">
        <div class="concept-label">💡 Cos'è il Fondo di Garanzia prima casa (Consap)</div>
        <div class="concept-text">
          È un fondo pubblico, gestito da Consap, che garantisce alla banca una parte del mutuo
          per l'acquisto della prima casa. Grazie a questa garanzia, alcune banche possono finanziare
          fino al <strong>100% del valore dell'immobile</strong>, senza richiedere anticipo.<br><br>
          L'accesso è riservato a categorie specifiche stabilite dalla legge (ad esempio persone under 36
          con determinati requisiti ISEE, o altre categorie prioritarie), e i requisiti possono cambiare nel tempo.
          La banca resta comunque libera di valutare la tua situazione, e continuano a valere le stesse
          regole di sostenibilità della rata rispetto al reddito.<br><br>
          Verifica i requisiti aggiornati con la tua banca o su consap.it prima di fare affidamento su questa opzione.
        </div>
      </div>
      <div class="options" id="options_consap">
        <button class="option-btn ${state.garanzia_consap === true ? 'selected' : ''}" onclick="selectConsap(true, this)">
          <div class="option-title">✅ Sì, rientro nella garanzia</div>
          <div class="option-desc">Posso valutare un mutuo fino al 100% del valore della casa, senza anticipo.</div>
        </button>
        <button class="option-btn ${state.garanzia_consap === false ? 'selected' : ''}" onclick="selectConsap(false, this)">
          <div class="option-title">🚫 No / non so</div>
          <div class="option-desc">Procedo con le condizioni standard (anticipo richiesto dalla banca).</div>
        </button>
      </div>
      <div class="card-question" style="margin-top:24px">Quanti soldi puoi versare subito di tasca tua?</div>
      <div class="card-hint">Questo si chiama acconto o anticipo. Il resto lo copre il mutuo.</div>
      <div class="concept">
        <div class="concept-label">💡 Cos'è l'acconto</div>
        <div class="concept-text" id="testo_acconto">
          L'acconto è la parte del prezzo che paghi tu con i tuoi risparmi, il giorno del rogito.
          La banca copre la differenza con il mutuo.
          Più alto è l'acconto, <strong>meno soldi chiedi in prestito</strong> e meno interessi paghi in totale.
          ${state.garanzia_consap
            ? 'Con la Garanzia Statale prima casa selezionata sopra, puoi impostare anche un anticipo di 0€.'
            : 'Le banche di solito finanziano al massimo l\'<strong>80% del valore della casa</strong>, quindi di norma serve almeno il <strong>20% di anticipo</strong> (qui puoi simulare fino al 10% per curiosità).'}
        </div>
      </div>
      <div class="input-group">
        <div class="input-label">Acconto disponibile</div>
        <div class="input-row">
          <input type="number" class="input-field" id="inp_acconto"
            placeholder="${fmt(default_acc)}" min="${min_acc}" max="${max_acconto}" step="1000"
            value="${state.acconto != null ? state.acconto : default_acc}"
            oninput="updateAccontoPreview()">
          <span class="input-unit">€</span>
        </div>
        <div class="input-error" id="err_acconto">L'acconto deve essere tra ${fmtEuro(min_acc)} e ${fmtEuro(max_acconto)}</div>
        <div class="slider-wrap">
          <input type="range" class="slider" id="sl_acconto"
            min="${min_acc}" max="${max_acconto}" step="1000"
            value="${state.acconto != null ? state.acconto : default_acc}"
            oninput="syncAccontoSlider(this.value)">
          <div class="slider-labels">
            <span>${fmt(minPct*100,0)}% — ${fmtEuro(min_acc)}</span>
            <span>80% — ${fmtEuro(max_acconto)}</span>
          </div>
        </div>
      </div>
      <div class="concept" id="preview_acconto">
        <div class="concept-label">📊 Come si divide</div>
        <div class="concept-text" id="preview_acconto_text"></div>
      </div>
      <button class="btn-next" id="btn_acconto" onclick="saveAcconto()" disabled>Continua: ${titoloProssimaSezione('acconto')} →</button>
    </div>`;

}

function selectConsap(valore, el) {
  state.garanzia_consap = valore;
  document.querySelectorAll('#options_consap .option-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');

  const minPct = getMinAccontoPct();
  const min_acc = Math.round(state.valore_immobile * minPct);
  const max_acconto = Math.round(state.valore_immobile * 0.8);
  const inp = document.getElementById('inp_acconto');
  const sl = document.getElementById('sl_acconto');
  if (inp) inp.min = min_acc;
  if (sl) sl.min = min_acc;
  const err = document.getElementById('err_acconto');
  if (err) err.textContent = `L'acconto deve essere tra ${fmtEuro(min_acc)} e ${fmtEuro(max_acconto)}`;
  const testo = document.getElementById('testo_acconto');
  if (testo) {
    testo.innerHTML = `
          L'acconto è la parte del prezzo che paghi tu con i tuoi risparmi, il giorno del rogito.
          La banca copre la differenza con il mutuo.
          Più alto è l'acconto, <strong>meno soldi chiedi in prestito</strong> e meno interessi paghi in totale.
          ${valore
            ? 'Con la Garanzia Statale prima casa selezionata sopra, puoi impostare anche un anticipo di 0€.'
            : 'Le banche di solito finanziano al massimo l\'<strong>80% del valore della casa</strong>, quindi di norma serve almeno il <strong>20% di anticipo</strong> (qui puoi simulare fino al 10% per curiosità).'}`;
  }
  const labels = document.querySelector('#sl_acconto')?.closest('.input-group')?.querySelector('.slider-labels');
  if (labels) labels.innerHTML = `<span>${fmt(minPct*100,0)}% — ${fmtEuro(min_acc)}</span><span>80% — ${fmtEuro(max_acconto)}</span>`;
  if (inp && parseFloat(inp.value) < min_acc) { inp.value = min_acc; if (sl) sl.value = min_acc; }
  updateAccontoPreview();
}

function syncAccontoSlider(val) {
  const inp = document.getElementById('inp_acconto');
  if (inp) inp.value = val;
  updateAccontoPreview();
}

function updateAccontoPreview() {
  const inp = document.getElementById('inp_acconto');
  const sl = document.getElementById('sl_acconto');
  if (!inp) return;

  const btn = document.getElementById('btn_acconto');
  if (btn) btn.disabled = !(state.garanzia_consap !== null && campoNumericoValido('inp_acconto'));

  const v = parseFloat(inp.value);
  if (sl && !isNaN(v)) sl.value = v;
  const mutuo = state.valore_immobile - v;
  const pct = Math.round((v / state.valore_immobile) * 100);
  const ptx = document.getElementById('preview_acconto_text');
  if (ptx && !isNaN(v) && v >= 0 && mutuo > 0) {
    const sogliaOk = state.garanzia_consap ? 0 : 20;
    ptx.innerHTML = `Acconto: <strong>${fmtEuro(v)}</strong> (${pct}%) · Mutuo richiesto: <strong>${fmtEuro(mutuo)}</strong> (${100-pct}%)<br>
    <span style="color: ${pct >= sogliaOk ? '#2d5a47' : '#c0392b'}">
    ${state.garanzia_consap
      ? 'ℹ️ Con la garanzia statale, la banca può finanziare anche il 100% del valore della casa.'
      : (pct >= 20 ? '✅ Acconto sufficiente per la maggior parte delle banche.' : '⚠️ La maggior parte delle banche richiede almeno il 20% di acconto.')}
    </span>`;
  }
}

function saveAcconto() {
  const v = parseFloat(document.getElementById('inp_acconto').value);
  const minPct = getMinAccontoPct();
  const min_acc = Math.round(state.valore_immobile * minPct);
  const max_acconto = Math.round(state.valore_immobile * 0.8);
  if (isNaN(v) || v < min_acc || v > max_acconto) {
    document.getElementById('err_acconto').classList.add('visible');
    return;
  }
  state.acconto = v;
  nextStep();
}

function renderLTV(wrap) {
  const ltv = getLTV();
  const mutuo = getMutuo();
  const ltvColor = ltv <= 50 ? '#4a9b7f' : ltv <= 70 ? '#1a2744' : ltv <= 80 ? '#e8834a' : '#c0392b';
  const ltvTextColor = ltv <= 50 ? 'var(--verde-label)' : ltv <= 70 ? 'var(--blu-testo)' : ltv <= 80 ? 'var(--arancio-label)' : '#c0392b';

  wrap.innerHTML += `
    <div class="step-label">Concetto chiave — LTV</div>
    <div class="card">
      <div class="card-question">Il tuo Loan-to-Value: ${fmt(ltv, 1)}%</div>
      <div class="card-hint">Questo numero dice alla banca quanto stai chiedendo rispetto al valore della casa.</div>
      <div class="concept">
        <div class="concept-label">💡 Cos'è il Loan-to-Value (LTV)</div>
        <div class="concept-text">
          LTV significa letteralmente "rapporto prestito-valore".
          Si calcola così: <strong>mutuo ÷ valore casa × 100</strong>.<br><br>
          Nel tuo caso: <strong>${fmtEuro(mutuo)} ÷ ${fmtEuro(state.valore_immobile)} = ${fmt(ltv,1)}%</strong><br><br>
          Più il tuo LTV è basso, più la banca ti considera un cliente affidabile —
          e spesso ti offre un <strong>tasso d'interesse più basso</strong>.
        </div>
      </div>
      <div style="margin: 16px 0; background: var(--grigio); border-radius: 12px; padding: 16px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; font-weight: 600; color: var(--testo-soft);">
          <span>LTV basso = migliori condizioni</span>
          <span style="color:${ltvTextColor}; font-size:15px; font-weight:800;">${fmt(ltv,1)}%</span>
        </div>
        <div style="height: 12px; background: var(--grigio-mid); border-radius: 6px; overflow: hidden;">
          <div style="height: 100%; width: ${Math.min(ltv,100)}%; background: ${ltvColor}; border-radius: 6px; transition: width 0.6s ease;"></div>
        </div>
        <div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; color: var(--testo-soft);">
          <span>0% — ottimo</span><span>80% — limite comune</span><span>100%</span>
        </div>
      </div>
      ${ltv <= 60 ? `<div class="concept"><div class="concept-label">🎯 Posizione con LTV basso</div><div class="concept-text">Con un LTV del ${fmt(ltv,1)}% sei sotto la soglia del 60-70% indicata spesso dalle banche per le condizioni migliori.</div></div>` :
        ltv <= 80 ? `<div class="warning"><div class="warning-label">📋 Nella norma</div><div class="warning-text">LTV dell'${fmt(ltv,1)}%: rientra nella norma. Alcune banche potrebbero richiedere un'assicurazione aggiuntiva sopra il 70%.</div></div>` :
        state.garanzia_consap ? `<div class="concept"><div class="concept-label">🏛️ LTV coperto dalla Garanzia Statale</div><div class="concept-text">LTV dell'${fmt(ltv,1)}%: sopra l'80% le banche di solito richiedono una copertura aggiuntiva. Hai indicato di rientrare nella Garanzia Statale prima casa (Consap), che copre proprio questa parte del mutuo verso la banca. Restano da verificare i requisiti di accesso e la sostenibilità della rata rispetto al reddito.</div></div>` :
        `<div class="warning"><div class="warning-label">⚠️ LTV elevato</div><div class="warning-text">LTV dell'${fmt(ltv,1)}%: sopra l'80% poche banche finanziano senza garanzie aggiuntive. Un acconto più alto ridurrebbe l'LTV.</div></div>`}
      <button class="btn-next" onclick="nextStep()">Continua: ${titoloProssimaSezione('ltv_spiegazione')} →</button>
    </div>`;
}

function renderIntestatari(wrap) {
  wrap.innerHTML += `
    <div class="step-label">Chi richiede il mutuo</div>
    <div class="card">
      <div class="card-question">Quanti anni hai?</div>
      <div class="card-hint">L'età è importante: le banche fissano un'età massima al termine del mutuo, di solito 75–80 anni.</div>
      <div class="concept">
        <div class="concept-label">💡 Il limite di età nei mutui</div>
        <div class="concept-text">
          Quasi tutte le banche italiane impongono che il mutuo sia estinto entro i
          <strong>75 o 80 anni</strong> del richiedente.
          Questo non è un giudizio sulla persona: è perché la banca deve valutare
          la capacità di rimborso per tutta la durata del prestito.<br><br>
          In pratica significa che la <strong>durata massima del mutuo</strong>
          dipende dalla tua età: se hai 50 anni e il limite è 80,
          puoi chiedere al massimo <strong>30 anni</strong> di mutuo.
          Se hai 60 anni, al massimo <strong>20 anni</strong>.
        </div>
      </div>
      <div class="input-group">
        <div class="input-label">La tua età attuale</div>
        <div class="input-row">
          <input type="number" class="input-field" id="inp_eta"
            placeholder="35" min="18" max="74" step="1"
            value="${state.eta || ''}">
          <span class="input-unit">anni</span>
        </div>
        <div class="input-error" id="err_eta">Inserisci un'età tra 18 e 74 anni</div>
      </div>
      <div id="preview_eta"></div>

      <div class="card-question" style="margin-top:28px">Fai il mutuo da solo o con un'altra persona?</div>
      <div class="card-hint">Un mutuo cointestato somma i redditi di entrambi, ma usa l'età più restrittiva tra i due per calcolare la durata massima.</div>
      <div class="concept">
        <div class="concept-label">💡 Come funziona un mutuo cointestato</div>
        <div class="concept-text">
          Se richiedi il mutuo insieme a un'altra persona (partner, familiare), la banca
          <strong>somma i redditi netti</strong> di entrambi per valutare la sostenibilità della rata —
          questo spesso permette di chiedere un importo più alto o avere una rata più leggera
          rispetto al reddito complessivo.<br><br>
          Per la <strong>durata massima</strong>, invece, la maggior parte delle banche
          usa l'età dell'intestatario <strong>più anziano</strong>: è il vincolo più prudente,

        </div>
      </div>
      <div class="options" id="options_cointestazione">
        <button class="option-btn ${state.cointestato === false ? 'selected' : ''}" onclick="selectCointestazione(false, this)">
          <div class="option-title">🧍 Da solo</div>
          <div class="option-desc">Un solo intestatario. Reddito ed età contano solo i tuoi.</div>
        </button>
        <button class="option-btn ${state.cointestato === true ? 'selected' : ''}" onclick="selectCointestazione(true, this)">
          <div class="option-title">🧍‍🧍 In coppia (cointestato)</div>
          <div class="option-desc">Due intestatari. I redditi si sommano, l'età più vincolante è quella del più anziano.</div>
        </button>
      </div>
      <div id="cointestatario_fields"></div>

      <div class="card-question" style="margin-top:28px">${state.cointestato ? 'Quanto guadagni tu al mese (netto)?' : 'Quanto guadagni al mese (netto)?'}</div>
      <div class="card-hint">${state.cointestato ? 'Il reddito del cointestatario lo inserisci qui sopra: qui metti solo il tuo.' : 'Serve per capire se la rata sarà sostenibile nel lungo periodo. Non viene salvato né condiviso.'}</div>
      <div class="concept">
        <div class="concept-label">💡 La regola del 30%</div>
        <div class="concept-text">
          Le banche di solito non concedono mutui se la rata supera il <strong>30–35% del reddito netto mensile</strong>${state.cointestato ? ' complessivo della coppia' : ''}.
          È una soglia prudenziale: sopra il 35% il rischio di difficoltà nel rimborso sale significativamente.<br><br>
          Esempio: con 2.000€ netti al mese, la rata resterebbe sotto la soglia del 30% se inferiore a circa <strong>600–700€</strong>.

        <div class="warning-label">📐 Come viene stimata la rata qui sotto</div>
        <div class="warning-text">
          La stima usa un tasso di riferimento del <strong>3,5%</strong> e la durata attuale di <strong>${state.durata} anni</strong> (potrai ancora modificarla al passo successivo).
          Se durata o tasso reale saranno diversi, la rata (e questa percentuale) cambierà di conseguenza.
        </div>
      </div>
      <div class="input-group">
        <div class="input-label">Il tuo reddito netto mensile</div>
        <div class="input-row">
          <input type="number" class="input-field" id="inp_reddito"

          <span class="input-unit">€/mese</span>
        </div>
        <div class="input-error" id="err_reddito">Inserisci un valore valido</div>
      </div>
      <div id="preview_reddito"></div>

      <button class="btn-next" id="btn_continua_intestatari" onclick="saveIntestatari()" disabled>Continua: ${titoloProssimaSezione('intestatari')} →</button>
    </div>`;

function updateEtaPreview() {
  const eta = parseInt(document.getElementById('inp_eta')?.value);
  const box = document.getElementById('preview_eta');
  if (!box) return;
  const ETA_MAX = 80;
  if (!eta || eta < 18 || eta > 74) { box.innerHTML = ''; return; }
  const durataMax = ETA_MAX - eta;
  const etaFine = eta + durataMax;
  const colore = durataMax >= 25 ? 'var(--verde)' : durataMax >= 15 ? 'var(--arancio)' : '#c0392b';
  const coloreLabel = durataMax >= 25 ? 'var(--verde-label)' : durataMax >= 15 ? 'var(--arancio-label)' : '#c0392b';
  box.innerHTML = `
    <div class="concept" style="border-color:${colore}; background: ${durataMax >= 25 ? 'var(--verde-light)' : 'var(--arancio-light)'}">
      <div class="concept-label" style="color:${coloreLabel}">📅 Il tuo orizzonte temporale</div>
      <div class="concept-text" style="color: ${durataMax >= 25 ? '#2d5a47' : '#7a4020'}">
        Con ${eta} anni, puoi chiedere un mutuo di <strong>massimo ${durataMax} anni</strong>
        (fino ai tuoi ${etaFine} anni, limite banca 80).<br>

function salvaAnagrafica() {
  const eta = parseInt(document.getElementById('inp_eta')?.value);
  if (!eta || eta < 18 || eta > 74) {
    document.getElementById('err_eta').classList.add('visible');
    return false;
  }
  if (state.cointestato === null) return false;

  state.eta = eta;
  let durataMax = 80 - eta;

  if (state.cointestato === true) {
    const eta2 = parseInt(document.getElementById('inp_eta2')?.value);
    const reddito2 = parseFloat(document.getElementById('inp_reddito2')?.value);
    state.eta2 = eta2 || null;
    state.reddito2 = reddito2 || null;
    const etaVinc = getEtaVincolante();
    if (etaVinc) durataMax = Math.min(durataMax, 80 - etaVinc);
  } else {
    state.eta2 = null;
    state.reddito2 = null;
  }

  if (state.durata > durataMax) state.durata = durataMax;
  return true;
}

function calcolaDatiAmmortamentoPeriodi(capitale, tasso_annuo, anni) {
  const n = anni * 12;
  const r = tasso_annuo / 100 / 12;
  const rata = calcRata(capitale, tasso_annuo, anni);
  const periodi = Math.min(anni, 6);
  const step = Math.floor(n / periodi);

  const dataPoints = [];
  let s = capitale;
  for (let i = 0; i < periodi; i++) {
    let int_period = 0, cap_period = 0;
    const from = i * step;
    const to = Math.min(from + step, n);
    const mesi = to - from;
    for (let m = from; m < to; m++) {
      const int_m = s * r;
      const cap_m = rata - int_m;
      int_period += int_m;
      cap_period += cap_m;
      s -= cap_m;
    }
    dataPoints.push({
      label: `Anno ${Math.floor(from / 12) + 1}`,
      mesi,
      cap: cap_period,
      int: int_period,
      total: int_period + cap_period,
      rataMensile: rata,
      capMedioMensile: cap_period / mesi,
      intMedioMensile: int_period / mesi,
      debitoResiduoFine: Math.max(s, 0),
    });
  }
  return dataPoints;
}

function calcolaPunteggioSalute() {
  const mutuo = getMutuo();
  const ltv = getLTV();
  const tasso = state.tipo_tasso === 'variabile' ? getTassoVariabile() : state.tasso_fisso;
  const rata = calcRata(mutuo, tasso, state.durata);
  const redditoTot = getRedditoTotale();
  const etaVinc = getEtaVincolante();

  let pLTV, pLTVdesc;
  if (ltv <= 50) { pLTV = 25; pLTVdesc = 'eccellente'; }
  else if (ltv <= 70) { pLTV = 20; pLTVdesc = 'molto buono'; }
  else if (ltv <= 80) { pLTV = 12; pLTVdesc = 'nella norma'; }
  else { pLTV = 4; pLTVdesc = state.garanzia_consap ? 'elevato, coperto dalla Garanzia Statale Consap' : 'elevato'; }

  let pRedd, pReddDesc, reddMancante = !redditoTot;
  if (reddMancante) { pRedd = 15; pReddDesc = 'dato non inserito'; }
  else {
    const pct = rata / redditoTot * 100;
    if (pct <= 25) { pRedd = 30; pReddDesc = 'molto sostenibile'; }
    else if (pct <= 30) { pRedd = 25; pReddDesc = 'sostenibile'; }
    else if (pct <= 35) { pRedd = 14; pReddDesc = 'al limite'; }
    else { pRedd = 3; pReddDesc = 'a rischio'; }
  }

  let pEta, pEtaDesc, etaMancante = !etaVinc;
  if (etaMancante) { pEta = 15; pEtaDesc = 'dato non inserito'; }
  else {
    const durataMax = 80 - etaVinc;
    const margine = durataMax - state.durata;
    if (margine >= 10) { pEta = 25; pEtaDesc = 'ampio margine'; }
    else if (margine >= 5) { pEta = 19; pEtaDesc = 'buon margine'; }
    else if (margine >= 1) { pEta = 11; pEtaDesc = 'margine ridotto'; }
    else { pEta = 5; pEtaDesc = 'al limite massimo'; }
  }

  let pStress, pStressDesc;
  if (reddMancante) { pStress = 10; pStressDesc = 'dato non inserito'; }
  else {
    const tassoStress = state.tipo_tasso === 'variabile' ? tasso + 2 : tasso;
    const rataStress = calcRata(mutuo, tassoStress, state.durata);
    const pctStress = rataStress / redditoTot * 100;
    if (pctStress <= 30) { pStress = 20; pStressDesc = 'solida anche con tassi in salita'; }
    else if (pctStress <= 35) { pStress = 14; pStressDesc = 'reggerebbe con qualche margine'; }
    else if (pctStress <= 42) { pStress = 7; pStressDesc = 'in difficoltà se i tassi salgono'; }
    else { pStress = 2; pStressDesc = 'molto vulnerabile a un rialzo tassi'; }
  }

  const totale = pLTV + pRedd + pEta + pStress;

  let verdetto, colore, bg;
  if (totale >= 80) { verdetto = 'Profilo solido'; colore = 'var(--verde-label)'; bg = 'var(--verde-light)'; }
  else if (totale >= 60) { verdetto = 'Profilo nella norma'; colore = 'var(--blu-verdict)'; bg = '#eaf2fb'; }
  else if (totale >= 40) { verdetto = 'Profilo da rafforzare'; colore = 'var(--arancio-label)'; bg = 'var(--arancio-light)'; }
  else { verdetto = 'Profilo fragile'; colore = 'var(--rosso)'; bg = 'var(--rosso-light)'; }

  return {
    totale, verdetto, colore, bg,
    pillars: [
      { nome: 'Rapporto prestito/valore (LTV)', icona: '🏦', punti: pLTV, max: 25, desc: pLTVdesc },
      { nome: 'Rata rispetto al reddito', icona: '💶', punti: pRedd, max: 30, desc: pReddDesc, mancante: reddMancante },
      { nome: 'Margine sull\'età limite', icona: '📅', punti: pEta, max: 25, desc: pEtaDesc, mancante: etaMancante },
      { nome: 'Tenuta a un rialzo dei tassi', icona: '📈', punti: pStress, max: 20, desc: pStressDesc, mancante: reddMancante },
    ]
  };
}

function suggerimentoMiglioramento(score) {
  const pesati = score.pillars.map(p => ({...p, ratio: p.punti / p.max}));
  pesati.sort((a,b) => a.ratio - b.ratio);
  const debole = pesati[0];

  if (debole.mancante) {
    return `Inserisci il dato sul reddito o sull'età nei passi precedenti: senza queste informazioni il punteggio resta parziale e non riflette la tua situazione reale.`;
  }
  if (debole.nome.includes('LTV')) {
    const mutuo = getMutuo();
    const targetLTV70 = state.valore_immobile * 0.70;
    const accontoNecessario = state.valore_immobile - targetLTV70;
    const extra = Math.max(0, accontoNecessario - state.acconto);
    return extra > 0
      ? `Aumentando l'acconto di circa <strong>${fmtEuro(extra,0)}</strong> porteresti l'LTV sotto il 70%, migliorando sensibilmente le condizioni offerte dalle banche.`
      : `Il tuo LTV è già in una fascia solida.`;
  }
  if (debole.nome.includes('reddito')) {
    return `Riducendo la durata o aumentando l'acconto abbasseresti la rata mensile rispetto al reddito. In alternativa, un secondo intestatario con reddito proprio (mutuo cointestato) alzerebbe il reddito di riferimento.`;
  }
  if (debole.nome.includes('età')) {
    const etaVinc = getEtaVincolante();
    const durataMax = 80 - etaVinc;
    const riduzione = state.durata - Math.max(5, durataMax - 8);
    return riduzione > 0
      ? `Il margine rispetto al limite d'età è ridotto. Valuta se accorciare la durata di qualche anno, se la rata risultante resta sostenibile.`
      : `Il margine sull'età è già adeguato.`;
  }
  if (debole.nome.includes('rialzo')) {
    return state.tipo_tasso === 'variabile'
      ? `Il tasso variabile rende la rata sensibile ai rialzi futuri. Se preferisci maggiore prevedibilità, valuta un tasso fisso o misto.`
      : `Verifica che la rata lasci un margine di sicurezza rispetto al reddito, in caso di imprevisti.`;
  }
  return `Il tuo profilo è già equilibrato su tutti i fronti principali.`;
}

function renderPunteggioSalute(wrap) {
  const score = calcolaPunteggioSalute();
  const suggerimento = suggerimentoMiglioramento(score);

  const angolo = -180 + (score.totale / 100) * 180;
  const rad = angolo * Math.PI / 180;
  const cx = 140, cy = 130, r = 100;
  const needleX = cx + r * 0.8 * Math.cos(rad);
  const needleY = cy + r * 0.8 * Math.sin(rad);

  function arcPath(startDeg, endDeg, radius) {
    const s = (startDeg) * Math.PI/180, e = (endDeg) * Math.PI/180;
    const x1 = cx + radius*Math.cos(s), y1 = cy + radius*Math.sin(s);
    const x2 = cx + radius*Math.cos(e), y2 = cy + radius*Math.sin(e);
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} A ${radius} ${radius} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }

  wrap.innerHTML += `
    <div class="step-label">Punteggio di salute del mutuo</div>
    <div class="card">
      <div class="card-question">Quanto è solido questo profilo, nel complesso?</div>
      <div class="card-hint">Un punteggio che combina LTV, sostenibilità della rata, margine sull'età e resistenza a un aumento dei tassi. Non è un giudizio della banca: è una sintesi per orientarti.</div>
      <div class="gauge-wrap">
        <svg class="gauge-svg" viewBox="0 0 280 150">
          <path d="${arcPath(-180,-135,100)}" stroke="var(--rosso)" stroke-width="16" fill="none" stroke-linecap="round" />
          <path d="${arcPath(-135,-90,100)}" stroke="var(--arancio)" stroke-width="16" fill="none" stroke-linecap="round" />
          <path d="${arcPath(-90,-45,100)}" stroke="var(--blu-accento)" stroke-width="16" fill="none" stroke-linecap="round" />
          <path d="${arcPath(-45,0,100)}" stroke="var(--verde)" stroke-width="16" fill="none" stroke-linecap="round" />
          <line x1="${cx}" y1="${cy}" x2="${needleX.toFixed(1)}" y2="${needleY.toFixed(1)}" stroke="var(--blu)" stroke-width="4" stroke-linecap="round"/>
          <circle cx="${cx}" cy="${cy}" r="7" fill="var(--blu)"/>
        </svg>
        <div class="gauge-score" style="color:${score.colore}">${score.totale}<span style="font-size:18px;color:var(--testo-soft);font-weight:600">/100</span></div>
        <div class="gauge-verdict" style="color:${score.colore}">${score.verdetto}</div>
        <div class="gauge-sub">${state.nome ? `Il profilo di ${state.nome}` : 'Il tuo profilo'} combina 4 fattori chiave</div>
      </div>
      <div class="pillar-list">
        ${score.pillars.map(p => {
          const pct = Math.round(p.punti/p.max*100);
          const colore = pct >= 80 ? 'var(--verde)' : pct >= 55 ? 'var(--blu-accento)' : pct >= 30 ? 'var(--arancio)' : 'var(--rosso)';
          const coloreTesto = pct >= 80 ? 'var(--verde-label)' : pct >= 55 ? 'var(--blu-verdict)' : pct >= 30 ? 'var(--arancio-label)' : 'var(--rosso)';
          return `<div class="pillar-row">
            <div class="pillar-icon">${p.icona}</div>
            <div class="pillar-info">
              <div class="pillar-name">${p.nome} ${p.mancante ? '<span style="color:var(--testo-soft);font-weight:400">(dato mancante)</span>' : `— <span style="color:${coloreTesto}">${p.desc}</span>`}</div>
              <div class="pillar-track"><div class="pillar-fill" style="width:${pct}%;background:${colore}"></div></div>
            </div>
            <div class="pillar-score" style="color:${coloreTesto}">${p.punti}/${p.max}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="suggerimento-box">
        <div class="suggerimento-label">💡 Cosa migliorerebbe di più il punteggio</div>
        <div class="suggerimento-text">${suggerimento}</div>
      </div>
      <div class="warning" style="margin-top:12px">
        <div class="warning-label">⚠️ Attenzione</div>
        <div class="warning-text">Questo punteggio è un modello educativo semplificato, non l'algoritmo reale di nessuna banca. Ogni istituto valuta con criteri propri, spesso più complessi.</div>
      </div>
      <button class="btn-next" onclick="nextStep()">Continua: ${titoloProssimaSezione('punteggio_salute')} →</button>
    </div>`;
}

  const rataF = calcRata(mutuo, tassoF, durata);
  const rataV = calcRata(mutuo, tassoV, durata);
  const totaleF = rataF * durata * 12;
  const totaleV = rataV * durata * 12;
  const intF = totaleF - mutuo;
  const intV = totaleV - mutuo;

  wrap.innerHTML += `
    <div class="step-label">Confronto — Fisso vs Variabile</div>

        <div class="comp-b">${fmtEuro(intV,0)}</div>
        <div class="comp-tag ${intF < intV ? 'tag-better' : 'tag-worse'}">${intF < intV ? 'meno' : 'più'}</div>
      </div>
      <div class="comparison-row">
        <div class="comp-label">Totale rimborsato</div>
        <div class="comp-a">${fmtEuro(totaleF,0)}</div>
        <div class="comp-b">${fmtEuro(totaleV,0)}</div>

      <div class="comparison-row">

function updateRedditoPreview() {
  const reddito1 = parseFloat(document.getElementById('inp_reddito')?.value);
  const box = document.getElementById('preview_reddito');
  if (!box || !reddito1 || reddito1 < 500) { if(box) box.innerHTML=''; return; }
  const reddito2 = state.cointestato ? (parseFloat(document.getElementById('inp_reddito2')?.value) || 0) : 0;
  const reddito = reddito1 + reddito2;
  const mutuo = getMutuo();
  const tasso = state.tasso_fisso || 3.5;
  const rata = calcRata(mutuo, tasso, state.durata);
  const pct = rata / reddito * 100;
  const soglia30 = reddito * 0.30;
  const soglia35 = reddito * 0.35;
  let colore, coloreTesto, testo, bg;
  if (pct <= 30) { colore = 'var(--verde)'; coloreTesto = 'var(--verde-label)'; bg = 'var(--verde-light)'; testo = `✅ <strong>Ottimo</strong>: la rata rappresenta il ${fmt(pct,1)}% del reddito${state.cointestato ? ' complessivo' : ''}. Sei ben sotto la soglia del 30%.`; }
  else if (pct <= 35) { colore = 'var(--arancio)'; coloreTesto = 'var(--arancio-label)'; bg = 'var(--arancio-light)'; testo = `⚠️ <strong>Borderline</strong>: la rata è il ${fmt(pct,1)}% del reddito${state.cointestato ? ' complessivo' : ''}. Molte banche accettano fino al 35%, ma il margine è stretto.`; }
  else { colore = '#c0392b'; coloreTesto = '#c0392b'; bg = 'var(--rosso-light)'; testo = `🔴 <strong>Attenzione</strong>: la rata è il ${fmt(pct,1)}% del reddito${state.cointestato ? ' complessivo' : ''}. Supera la soglia del 35%: la banca potrebbe non concedere il mutuo o chiedere un garante.`; }
  const fillW = Math.min(pct / 50 * 100, 100);
  const marker30 = 30/50*100;
  const marker35 = 35/50*100;
  box.innerHTML = `
    ${state.cointestato ? `<div class="concept" style="margin-bottom:8px">
      <div class="concept-label">👥 Reddito complessivo della coppia</div>
      <div class="concept-text">${fmtEuro(reddito1,0)} (tuo) + ${fmtEuro(reddito2,0)} (cointestatario) = <strong>${fmtEuro(reddito,0)} al mese</strong></div>
    </div>` : ''}
    <div class="meter-wrap">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;font-weight:600;color:var(--testo-soft)">
        <span>Rata mensile stimata: <strong style="color:var(--blu-testo)">${fmtEuro(rata,0)} al mese</strong></span>
        <span style="color:${coloreTesto};font-weight:800">${fmt(pct,1)}% del reddito</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" style="width:${fillW}%;background:${colore}"></div>
        <div class="meter-marker" style="left:${marker30}%" title="30%"></div>
        <div class="meter-marker" style="left:${marker35}%" title="35%"></div>
      </div>
      <div class="meter-labels"><span>0%</span><span style="color:var(--verde-label)">30%</span><span style="color:var(--arancio-label)">35%</span><span>50%+</span></div>
    </div>
    <div class="concept" style="border-color:${colore};background:${bg}">
      <div class="concept-text" style="color:${pct<=30?'#2d5a47':pct<=35?'#7a4020':'#7a1010'}">${testo}<br><br>
      Per stare sotto il 30% con il tuo reddito, la rata massima ideale è <strong>${fmtEuro(soglia30,0)} al mese</strong>.<br>
      Questo corrisponde a un mutuo di circa <strong>${fmtEuro(calcMutuoDaRata(soglia30, tasso, state.durata),0)}</strong> alle condizioni attuali.</div>
    </div>`;
}

function calcMutuoDaRata(rata_mensile, tasso_annuo, anni) {
  if (tasso_annuo === 0) return rata_mensile * anni * 12;
  const r = tasso_annuo / 100 / 12;
  const n = anni * 12;
  return rata_mensile * (Math.pow(1+r,n) - 1) / (r * Math.pow(1+r,n));
}

function calcolaSaldoResiduo(capitale, tasso_annuo, anni_totali, anni_trascorsi) {
  if (tasso_annuo === 0) return capitale - (capitale / (anni_totali * 12)) * (anni_trascorsi * 12);
  const r = tasso_annuo / 100 / 12;
  const n = anni_totali * 12;
  const k = anni_trascorsi * 12;
  const rata = calcRata(capitale, tasso_annuo, anni_totali);
  return rata * (1 - Math.pow(1+r, -(n-k))) / r;
}

function setLanguage(lang, attempt) {
  attempt = attempt || 0;
  const combo = document.querySelector('.goog-te-combo');

  if (!combo) {
    if (attempt < 20) {
      setTimeout(() => setLanguage(lang, attempt + 1), 250);
    }
    return;
  }

  if (combo.value !== lang) {
    combo.value = lang;
    combo.dispatchEvent(new Event('change'));
  }

  currentLang = lang;
  document.querySelectorAll('.lang-btn').forEach(btn => {

  });
